name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
      - name: Install verified code-intelligence native library
        run: mise run setup-codeintel
      - name: Check repository
        run: mise run checks
